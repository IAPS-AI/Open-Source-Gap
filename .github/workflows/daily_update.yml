name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Best-effort: a git/install failure here must NOT abort the daily build.
      # update_data.py falls back to the analytical test if eci is absent and
      # flags the run with a warning.
      - name: Install optional ECI bootstrap dependency
        continue-on-error: true
        run: pip install -r requirements-optional.txt

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update benchmark data (daily digest)"
          file_pattern: data.json
          skip_dirty_check: false    
