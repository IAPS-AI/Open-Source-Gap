name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Pages lets browsers cache assets for 10 minutes. Stamping the asset
      # URLs with the commit means a deploy never pairs new HTML with a
      # browser-cached old script or stylesheet.
      - name: Cache-bust static assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E \
            -e "s#static/script\.js(\?v=[^\"]*)?\"#static/script.js?v=${v}\"#" \
            -e "s#static/style\.css(\?v=[^\"]*)?\"#static/style.css?v=${v}\"#" \
            index.html
          grep -q "static/script.js?v=${v}\"" index.html
          grep -q "static/style.css?v=${v}\"" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
